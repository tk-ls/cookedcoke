<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme_xyz') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.documentElement.classList.add('no-transition');
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Your Reward | Cooked Coke Co.</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥤</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --text: #f5f5f7;
      --text-muted: #86868b;
      --accent: #ff3b30;
      --border: #424245;
      --surface: #1d1d1f;
      --nav-bg: rgba(0, 0, 0, 0.8);
      --banner-bg: linear-gradient(135deg, #1d1d1f 0%, #000000 100%);
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --text: #1d1d1f;
      --text-muted: #86868b;
      --accent: #ff3b30;
      --border: #d2d2d7;
      --surface: #f5f5f7;
      --nav-bg: rgba(255, 255, 255, 0.8);
      --hero-gradient: linear-gradient(180deg, #1d1d1f 0%, #86868b 100%);
      --banner-bg: linear-gradient(135deg, #f5f5f7 0%, #ffffff 100%);
    }

    .no-transition * {
      transition: none !important;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.47059;
      font-weight: 400;
      letter-spacing: -0.022em;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── NAV ─── */
    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--nav-bg);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-content {
      width: 100%;
      max-width: 1024px;
      padding: 0 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-logo {
      font-weight: 600;
      font-size: 17px;
      text-decoration: none;
      color: var(--text);
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 30px;
    }
    .nav-links {
      display: flex;
      gap: 30px;
      list-style: none;
    }
    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 1; }

    .theme-toggle {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 16px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .theme-toggle:hover { opacity: 1; }

    /* ─── MAIN ─── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 22px;
    }

    .card {
      background: var(--surface);
      border-radius: 28px;
      padding: 50px;
      max-width: 500px;
      width: 100%;
      border: 1px solid var(--border);
      text-align: center;
      transition: background-color 0.3s ease;
    }

    .card-tag {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 15px;
      display: block;
    }

    .card-title {
      font-size: clamp(28px, 6vw, 40px);
      font-weight: 700;
      letter-spacing: -0.015em;
      margin-bottom: 20px;
    }

    .card-sub {
      font-size: 17px;
      color: var(--text-muted);
      margin-bottom: 30px;
      line-height: 1.5;
    }

    /* ─── CODE BOX ─── */
    .code-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 30px;
      transition: background-color 0.3s ease;
    }
    .code-text {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-family: 'Inter', monospace;
    }
    .btn-copy {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 8px 16px;
      border-radius: 980px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-copy:hover { opacity: 0.8; }
    .btn-copy.copied { background: #34c759; color: #fff; }

    .btn-primary {
      display: block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 16px;
      border-radius: 980px;
      font-weight: 600;
      font-size: 17px;
      transition: transform 0.3s ease;
    }
    .btn-primary:hover { transform: scale(1.02); }

    /* ─── FOOTER ─── */
    footer {
      padding: 80px 22px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }
    .footer-content {
      max-width: 1024px;
      margin: 0 auto;
      border-top: 1px solid var(--border);
      padding-top: 40px;
    }

    @media (max-width: 734px) {
      .card { padding: 30px; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-content">
    <a href="/" class="nav-logo"><img src="logo.png" alt="Cooked Coke Co." style="height: 24px; vertical-align: middle;"></a>
    <div class="nav-right">
      <ul class="nav-links">
        <li><a href="/">← Back</a></li>
        <li><a href="https://cookedcoke.square.site/s/shop" target="_blank">Shop</a></li>
      </ul>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
        <span id="themeIcon">🌓</span>
      </button>
    </div>
  </div>
</nav>

<main>
  <div class="card">
    <span class="card-tag">Voter Reward</span>
    <h2 class="card-title">Success.</h2>
    <p class="card-sub">Use the code below during checkout for a 10% discount on your next refreshment.</p>
    
    <div class="code-box">
      <span class="code-text" id="code">......</span>
      <button class="btn-copy" id="copyBtn" onclick="copyCode()">Copy</button>
    </div>

    <a href="https://cookedcoke.square.site/s/shop" target="_blank" class="btn-primary">Order Now</a>
    <p class="card-sub" style="margin-top: 20px; font-size: 12px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em;">Pickup only · Level 7 Hub</p>
  </div>
</main>

<footer>
  <div class="footer-content">
    <p>Copyright © 2026 Cooked Coke Social Enterprise. Level 7 Refreshment Hub.</p>
  </div>
</footer>

<script>
  const themeToggle = document.getElementById('themeToggle');
  const htmlElement = document.documentElement;

  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      htmlElement.classList.remove('no-transition');
    }, 100);
  });

  themeToggle.addEventListener('click', () => {
    const currentTheme = htmlElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    htmlElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme_xyz', newTheme);
  });

  // RULE: First Digit + Last Digit = 10
  function generateCode() {
    const first = Math.floor(Math.random() * 9) + 1;
    const last = 10 - first;
    let middle = '';
    for (let i = 0; i < 4; i++) { middle += Math.floor(Math.random() * 10); }
    return first.toString() + middle + last.toString();
  }

  let secretCode = localStorage.getItem('voterCode');
  if (!secretCode) {
    secretCode = generateCode();
    localStorage.setItem('voterCode', secretCode);
  }
  document.getElementById('code').textContent = secretCode;

  function copyCode() {
    const code = document.getElementById('code').textContent;
    const btn = document.getElementById('copyBtn');
    navigator.clipboard.writeText(code).then(() => {
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy';
        btn.classList.remove('copied');
      }, 2000);
    });
  }
</script>

</body>
</html>
